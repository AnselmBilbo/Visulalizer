name: CI/CD Pre-PR Security Firewall & Unified Branch Gate

on:
  push:
    branches:
      - 'feature/**'
      - 'agent/**'
      - 'codex/**'
      - 'fix/**'
      - 'main'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  security-and-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VIBE_GIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. Template Self-Protection & Security Self-Tests
        run: node .ai-context/lib/self-test.js

      - name: 2. Project Automated Test Suite (TDD Gate)
        run: |
          node -e "
            const { runProjectTests } = require('./.ai-context/agents/dev-agent');
            const res = runProjectTests();
            if (!res.passed) {
              console.error(res.errorOutput);
              process.exit(1);
            }
          "

      - name: 3. Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.VIBE_GIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 4. Semgrep SAST Code Scan
        run: pipx run semgrep scan --config p/default --error

      - name: 5. Trivy Vulnerability, Secret & Misconfig Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: 6. Reviewer-Agent (DRY & Anti-Hallucination Architect Check)
        if: github.ref_name != 'main'
        env:
          LLM_PROVIDER: ${{ vars.DEV_LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.DEV_LLM_MODEL || 'gemini-2.5-pro' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          VIBE_GIT_TOKEN: ${{ secrets.VIBE_GIT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.VIBE_GIT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: node .ai-context/agents/reviewer-agent.js

      - name: 7. Auto-Create Pull Request for Verified Antigravity IDE / Codex Branches
        if: success() && github.event_name == 'push' && github.ref_name != 'main'
        env:
          LLM_PROVIDER: ${{ vars.DEV_LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.DEV_LLM_MODEL || 'gemini-2.5-pro' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          VIBE_GIT_TOKEN: ${{ secrets.VIBE_GIT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.VIBE_GIT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: node .ai-context/lib/create-verified-pr.js
