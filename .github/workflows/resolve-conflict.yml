name: Conflict Resolver Agent

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve-merge-conflict:
    if: github.event.label.name == 'Resolve Conflict' || github.event.label.name == 'resolve-conflict'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.VIBE_GIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Git User
        run: |
          git config user.name "AI Conflict Resolver"
          git config user.email "conflict-bot@users.noreply.github.com"

      - name: Merge Main to Expose Conflict Markers
        run: git merge origin/main || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Dev-Agent in Conflict Resolution Mode
        env:
          CONFLICT_MODE: 'true'
          LLM_PROVIDER: ${{ vars.DEV_LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.DEV_LLM_MODEL || 'gemini-2.5-pro' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          VIBE_GIT_TOKEN: ${{ secrets.VIBE_GIT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.VIBE_GIT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_TITLE: ${{ github.event.pull_request.title }}
          ISSUE_BODY: "CRITICAL TASK: Resolve all git merge conflicts ('<<<<<<<' markers) semantically so both features remain intact, remove all conflict markers, and ensure all tests pass."
        run: node .ai-context/agents/dev-agent.js

      - name: Verify Self-Tests Before Pushing Resolved Code
        run: node .ai-context/lib/self-test.js

      - name: Commit and Push Verified Conflict Resolution
        if: success()
        run: |
          git add .
          git commit -m "fix(merge): semantically resolve merge conflicts with main" || echo "No conflicts to commit"
          git push origin ${{ github.event.pull_request.head.ref }}
